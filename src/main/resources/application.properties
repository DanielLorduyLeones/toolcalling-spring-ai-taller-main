spring.application.name=toolcalling

# La clave NUNCA se escribe aquí: se lee de la variable de entorno GROQ_API_KEY.
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai

# Modelo de Groq con soporte de Tool Calling (se puede cambiar con la variable GROQ_MODEL).
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
