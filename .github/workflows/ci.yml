name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        # Las pruebas no usan la API real de Groq: la clave es un valor ficticio.
        env:
          GROQ_API_KEY: clave-ficticia-para-ci
        run: ./mvnw -B verify
